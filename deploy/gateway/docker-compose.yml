# LLM gateway: smg behind Caddy.
#
# Copy gateway.env.example to gateway.env, fill it in, then:
#   docker compose --env-file gateway.env up -d
#
# smg deliberately publishes NO host port. Caddy is the only way in, so the
# worker-management and admin surfaces are unreachable from outside this
# compose network even if smg's own authorization were wrong.

name: llm-gateway

services:
  smg:
    image: lightseekorg/smg:1.9.0 # pinned; :latest would upgrade under you
    container_name: smg
    restart: unless-stopped
    # No `ports:` — reachable only from the caddy service, by design.
    expose:
      - "3000"
    # The image's entrypoint is already `python3 -m smg.launch_router`, so
    # arguments go straight in. Do NOT prefix them with `launch` — that is the
    # bare-binary form and the module rejects it as an unrecognized argument.
    command:
      - --host=0.0.0.0
      - --port=3000
      # --worker-urls takes MULTIPLE values after ONE flag (verified against
      # `launch --help`: "--worker-urls [WORKER_URLS ...]"). The `=` form
      # would bind only the first URL and leave the second as a stray
      # positional argument.
      - --worker-urls
      - ${REPLICA_A_URL}
      - ${REPLICA_B_URL}

      # --- liveness ------------------------------------------------------
      # Active health checking is DISABLED on purpose. smg's health checker
      # has a TERMINAL Failed state: after 3 x --health-failure-threshold
      # consecutive failures (3 x 3 = 9, at a 60 s interval, so ~9 minutes) a
      # worker is Failed, and its own docs are explicit that "Successful
      # probes do not recover a Failed worker" — it needs manual
      # re-registration or a gateway restart.
      #
      # Taking the GPUs back for development ALWAYS exceeds 9 minutes, so with
      # the default the gateway would need restarting after every single dev
      # session. The circuit breaker below is traffic-driven and self-heals,
      # which is the behaviour this deployment actually wants.
      - --disable-health-check
      - --cb-failure-threshold=10
      - --cb-timeout-duration-secs=60
      - --cb-success-threshold=3

      # --- routing -------------------------------------------------------
      # cache_aware keeps a conversation on the replica that holds its prefix.
      # The two replicas share no KV: a follow-up that lands on the wrong one
      # re-pays the cold prefill (89 s at 131K, 214 s at 260K). This is a
      # quality-of-experience requirement, not tuning.
      - --policy=cache_aware
      - --max-concurrent-requests=${MAX_CONCURRENT_REQUESTS:-8}
      - --queue-size=32

      # --- timeouts, sized for long context ------------------------------
      # Cold prefill emits nothing on the wire until the engine yields:
      # measured 89 s at 131K and 214 s at 260K. Anything in this path with a
      # 30/60 s default will cut a healthy request mid-prefill.
      - --queue-timeout-secs=600
      - --request-timeout-secs=${SMG_REQUEST_TIMEOUT_SECS:-1800}
      - --retry-max-retries=2
      - --max-idle-secs=14400

    environment:
      RUST_LOG: ${SMG_LOG_LEVEL:-info}
    # NOTE ON AUTHENTICATION: smg has no client-facing API key for inference.
    # `--api-key` is for authorizing to the WORKER, and
    # `--control-plane-api-keys` covers only the management API. So anything
    # able to reach port 3000 can run inference without a credential — which
    # is exactly why this service publishes no host port and Caddy performs
    # the authentication. Do not add a `ports:` entry here.
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    container_name: gateway-caddy
    restart: unless-stopped
    depends_on: [smg]
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_PORT:-8443}:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates, if Caddy terminates TLS
      - caddy_config:/config
    environment:
      GATEWAY_PORT: "8443"
      UPSTREAM: "smg:3000"
      PROXY_TIMEOUT: ${CADDY_PROXY_TIMEOUT:-7200s}
      # Caddy's {$VAR} reads the CADDY PROCESS environment, not the compose
      # env-file, so every token must be forwarded explicitly here. Adding a
      # person means a line in gateway.env, a line in the Caddyfile map, AND a
      # line here.
      #
      # The `:?` makes an unset or empty token a hard startup failure. That is
      # deliberate: an empty token expands the map entry to a bare "Bearer ",
      # which would authenticate anyone who sends an empty bearer token. With
      # two or more people it merely collides and Caddy refuses to start, but
      # with a single person it would silently come up wide open.
      TOKEN_OWNER: ${TOKEN_OWNER:?set TOKEN_OWNER in gateway.env}
      TOKEN_FRIEND_1: ${TOKEN_FRIEND_1:?set TOKEN_FRIEND_1 in gateway.env}
      TOKEN_FRIEND_2: ${TOKEN_FRIEND_2:?set TOKEN_FRIEND_2 in gateway.env}
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
